name: Generar Feed RPP Política

on:
  schedule:
    - cron: '0 */3 * * *'  # cada 3 horas
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Generar feed
        run: python generate_feed.py

      - name: Publicar feed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "Actualizar feed RPP política"
          git push
